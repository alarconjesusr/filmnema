spring.application.name=filmnema-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netflox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
file.upload.dir=${FILE_UPLOAD_DIR:src/main/resources/imgs}
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:${file.upload.dir}/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
security.jwt.secret=${JWT_SECRET:c3VwZXItc2VjdXJlLWZpbG1uZW1hLWFwaS1qd3Qtc2VjcmV0LWtleS0zMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.jwt.issuer=${JWT_ISSUER:filmnema-api}
